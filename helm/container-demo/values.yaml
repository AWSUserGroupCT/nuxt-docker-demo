# Image built from the repo Dockerfile. For a remote cluster, push it to your
# registry and set image.repository. Tag defaults to the chart appVersion.
image:
  repository: dmevanct/nuxt-demo
  tag: "v0.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Ignored while autoscaling.enabled is true (the HPA owns the replica count).
replicaCount: 3

containerPort: 3000

# Extra environment variables for the web container.
env: []
#  - name: APP_VERSION
#    value: "1.0.1"

podAnnotations: {}
podLabels: {}

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 5
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 10

# The image runs as the non-root "node" user (uid 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  # ClusterIP: traffic enters through the shared ALB (ingress below).
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Served by the AWS Load Balancer Controller. Every Ingress with the same
  # group.name shares one ALB (same group as the API charts).
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: shared-api
    # Catch-all "/" must be evaluated after the API path rules (order 10, 20, ...).
    alb.ingress.kubernetes.io/group.order: "100"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:877969058937:certificate/619056d9-9897-4988-8bbe-b3e111dbb006
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=platform,Project=container-demo
  hosts:
    - host: app.pres.labspres.com
      paths:
        - path: /
          pathType: Prefix
  # TLS terminates at the ALB (certificate-arn above), so no tls block is needed.
  tls: []

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  # targetMemoryUtilizationPercentage: 80

# Keeps at least this many pods up during node drains and cluster upgrades.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []
affinity: {}
