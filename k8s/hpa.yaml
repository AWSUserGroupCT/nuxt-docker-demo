apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: container-demo
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: container-demo }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
