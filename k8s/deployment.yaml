apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-demo
spec:
  replicas: 3
  selector:
    matchLabels: { app: container-demo }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: container-demo }
    spec:
      containers:
        - name: web
          image: container-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: container-demo
spec:
  type: LoadBalancer
  selector: { app: container-demo }
  ports: [{ port: 80, targetPort: 3000 }]
