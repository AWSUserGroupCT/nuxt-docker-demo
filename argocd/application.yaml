# Argo CD Application for the container-demo Helm chart.
# Apply with: kubectl apply -n argocd -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: container-demo
  namespace: argocd
  finalizers:
    # Deleting the Application also deletes the resources it deployed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AWSUserGroupCT/nuxt-docker-demo.git
    targetRevision: HEAD
    path: helm/container-demo
    helm:
      releaseName: container-demo
      valueFiles:
        - values.yaml
      # Override chart values here, e.g. to pull from a registry:
      # valuesObject:
      #   image:
      #     repository: ghcr.io/awsusergroupct/nuxt-docker-demo
      #     tag: "1.0.0"
  destination:
    # The cluster Argo CD itself runs in.
    server: https://kubernetes.default.svc
    namespace: container-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The HPA owns the replica count, so don't flag it as drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
